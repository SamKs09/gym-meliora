name: Deploy to Cloudflare

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json

      # Build Frontend
      - name: Build frontend
        working-directory: frontend
        run: |
          npm install
          npm run build
          ls -la out/

      # Deploy Worker
      - name: Deploy Worker to Cloudflare
        run: npx wrangler deploy --env production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Deploy Frontend to Pages
      - name: Deploy frontend to Cloudflare Pages
        run: npx wrangler pages deploy ./frontend/out --project-name=gym-meliora
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Verification
      - name: Deployment summary
        run: |
          echo "✅ Deployment completed successfully"
          echo ""
          echo "⚠️  IMPORTANT: Configure Worker Routes manually"
          echo "Go to: Cloudflare Dashboard → Workers & Pages → Routes"
          echo ""
          echo "Add route:"
          echo "  Pattern: share.gym-meliora.com/*"
          echo "  Worker: gym-meliora"
          echo "  Zone: gym-meliora.com"
