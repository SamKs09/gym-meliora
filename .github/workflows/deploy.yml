name: Deploy to Cloudflare

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      # Build Frontend (Static export to frontend/out)
      - name: Install and Build Frontend
        working-directory: frontend
        run: |
          npm ci || npm install
          npm run build
          ls -la out/
        env:
          NEXT_PUBLIC_BACKEND_URL: ${{ secrets.NEXT_PUBLIC_BACKEND_URL }}
          NEXT_PUBLIC_SHARE_DOMAIN: ${{ secrets.NEXT_PUBLIC_SHARE_DOMAIN }}

      # Deploy Worker (if Cloudflare secrets configured in GitHub Actions)
      - name: Deploy Worker to Cloudflare
        if: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
        run: npx wrangler deploy --env production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Deploy Frontend to Pages (if Cloudflare secrets configured in GitHub Actions)
      - name: Deploy Frontend to Cloudflare Pages
        if: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
        run: npx wrangler pages deploy ./frontend/out --project-name=gym-meliora
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Verification Summary
      - name: Deployment summary
        run: |
          echo "✅ Deployment to Cloudflare completed successfully"
          echo ""
          echo "⚠️  Cloudflare Worker Route Setup:"
          echo "  Pattern: share.gym-meliora.com/*"
          echo "  Worker: gym-meliora"
          echo "  Zone: gym-meliora.com"
