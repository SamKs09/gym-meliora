name = "gym-meliora"
compatibility_date = "2024-09-23"
main = "src/worker.js"

[site]
bucket = "./frontend/out"

# Configure routes for share links handler
[[routes]]
pattern = "share.gym-meliora.com/*"
zone_name = "gym-meliora.com"

# Environment variables
[env.production]
vars = { BACKEND_URL = "https://api.gym-meliora.com", FRONTEND_URL = "https://gym-meliora.com" }

[env.staging]
vars = { BACKEND_URL = "https://staging-api.gym-meliora.com", FRONTEND_URL = "https://staging.gym-meliora.com" }

[env.development]
vars = { BACKEND_URL = "http://localhost:5000", FRONTEND_URL = "http://localhost:3000" }
